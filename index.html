<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Website Deals</title>
  <meta name="description" content="Secure administrator login for Website Deals.">
  <meta name="theme-color" content="#12a050">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../../logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      /* Change --bg to #ff5f1f for the orange Cloudflare look */
      --bg: #12a050;
      --ink: #0b1118;
      --white: #fff;
      --line: rgba(255,255,255,.34);
      --soft: rgba(255,255,255,.82);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--white);
      background-color: var(--bg);
      background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1.3px);
      background-size: 14px 14px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    a { color: inherit; }

    /* ---------- Navbar ---------- */
    .nav {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    .nav-brand img {
      width: 38px; height: 38px;
      padding: 5px;
      border-radius: 11px;
      background: #fff;
      object-fit: contain;
    }
    .nav-brand strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.2px;
    }
    .nav-brand span {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--soft);
    }
    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .pill-link:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,.14); }

    /* ---------- Hero / form area ---------- */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 60px;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
    }
    .badge i { font-size: 11px; }

    h1 {
      margin-top: 22px;
      font-size: clamp(44px, 9vw, 72px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -.05em;
    }

    .meta {
      margin-top: 20px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #fff;
    }

    /* ---------- Alert ---------- */
    .alert {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin-top: 26px;
      padding: 12px 16px;
      border-radius: 16px;
      background: #fff;
      color: #b4232f;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      text-align: left;
    }
    .alert.show { display: flex; }
    .alert i { margin-top: 2px; }

    /* ---------- Form ---------- */
    form { margin-top: 28px; text-align: left; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      margin: 0 0 8px 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--soft);
    }
    .input {
      position: relative;
    }
    .input > i {
      position: absolute;
      left: 20px; top: 50%;
      transform: translateY(-50%);
      color: #7c8793;
      font-size: 14px;
      pointer-events: none;
    }
    .input input {
      width: 100%;
      height: 54px;
      padding: 0 52px 0 50px;
      border: 2px solid transparent;
      border-radius: 999px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .input input::placeholder { color: #9aa4ae; font-weight: 400; }
    .input input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 4px rgba(11,17,24,.14);
    }
    .toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      width: 34px; height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: transparent;
      color: #7c8793;
      font-size: 14px;
    }
    .toggle:hover { color: var(--ink); background: #f0f2f4; }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 6px 22px;
      font-size: 12px;
    }
    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--soft);
      cursor: pointer;
    }
    .remember input {
      width: 16px; height: 16px;
      accent-color: #0b1118;
      cursor: pointer;
    }
    .forgot {
      color: #fff;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .submit {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    }
    .submit:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(0,0,0,.18); }
    .submit:active { transform: translateY(0); }
    .submit.loading { pointer-events: none; opacity: .85; }

    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(11,17,24,.25);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .submit.loading .spinner { display: block; }
    .submit.loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .note {
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: var(--soft);
    }

    /* ---------- Footer ---------- */
    .foot {
      padding: 0 24px 24px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.8);
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      right: 24px; bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 280px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 18px 40px rgba(0,0,0,.2);
      transform: translateY(25px);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-icon {
      width: 34px; height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8f8ee;
      color: #108344;
    }
    .toast strong { display: block; font-size: 13px; }
    .toast span { display: block; margin-top: 2px; font-size: 12px; color: #6b7682; }

    @media (max-width: 560px) {
      .nav { padding: 16px 18px; }
      .nav-brand span { display: none; }
      .toast { left: 16px; right: 16px; bottom: 16px; min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>

  <!-- ============ NAVBAR ============ -->
  <header class="nav">
    <a href="../../index.html" class="nav-brand">
      <img src="../../logo.png" alt="Website Deals" onerror="this.style.display='none'">
      <div>
        <strong>Website Deals</strong>
        <span>Admin Control Center</span>
      </div>
    </a>

    <a href="../../index.html" class="pill-link">
      <i class="fa-solid fa-arrow-left"></i>
      Marketplace
    </a>
  </header>

  <!-- ============ LOGIN ============ -->
  <main class="stage">
    <div class="wrap">

      <span class="badge">
        <i class="fa-solid fa-lock"></i>
        Secure admin portal · Authorized access only
      </span>

      <h1>Admin Login</h1>

      <p class="meta">Website Deals · Control Center</p>

      <div class="alert" id="login-alert" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="login-alert-text">Please enter your login details.</span>
      </div>

      <form id="login-form" novalidate>

        <div class="field">
          <label for="email">Email address</label>
          <div class="input">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" name="email" placeholder="admin@example.com" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle" id="password-toggle" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember">
            <span>Remember this device</span>
          </label>
          <a href="#" class="forgot" id="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="submit" id="login-btn">
          <span class="spinner"></span>
          <i class="fa-solid fa-arrow-right-to-bracket btn-icon"></i>
          <span class="btn-text">Sign In</span>
        </button>

      </form>

      <p class="note">
        <i class="fa-solid fa-shield-halved"></i>
        Never share your login credentials.
      </p>

    </div>
  </main>

  <footer class="foot">
    &copy; <span id="brand-year"></span> Website Deals
  </footer>

  <!-- ============ TOAST ============ -->
  <div class="toast" id="toast">
    <div class="toast-icon"><i class="fa-solid fa-circle-check"></i></div>
    <div>
      <strong id="toast-title">Success</strong>
      <span id="toast-message">Action completed successfully.</span>
    </div>
  </div>

  <!-- ============ ADMIN LOGIN (Cloudflare) ============
       Logs in through the Worker (/api/login). No Firebase.
  ================================================== -->
  <script>
  (function () {
    "use strict";
    var KEY  = "websiteDealsAdminAuth";
    var DASH = "../dashboard.html";
    var $ = function (id) { return document.getElementById(id); };

    var form = $("login-form"),
        emailInput = $("email"),
        passInput = $("password"),
        rememberInput = $("remember"),
        btn = $("login-btn"),
        btnText = btn.querySelector(".btn-text"),
        alertBox = $("login-alert"),
        alertText = $("login-alert-text"),
        toast = $("toast"),
        toastTitle = $("toast-title"),
        toastMessage = $("toast-message");

    $("brand-year").textContent = new Date().getFullYear();

    function showError(m) { alertText.textContent = m; alertBox.classList.add("show"); }
    function hideError() { alertBox.classList.remove("show"); }

    var toastTimer;
    function showToast(title, message) {
      toastTitle.textContent = title;
      toastMessage.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 3500);
    }

    function setLoading(on) {
      btn.classList.toggle("loading", on);
      btn.disabled = on;
      btnText.textContent = on ? "Signing in..." : "Sign In";
    }

    var savedEmail = localStorage.getItem("websiteDealsRememberedEmail");
    if (savedEmail) { emailInput.value = savedEmail; rememberInput.checked = true; }

    $("password-toggle").addEventListener("click", function () {
      var hide = passInput.type === "password";
      passInput.type = hide ? "text" : "password";
      $("password-toggle").innerHTML = hide
        ? '<i class="fa-regular fa-eye-slash"></i>'
        : '<i class="fa-regular fa-eye"></i>';
      $("password-toggle").setAttribute("aria-label", hide ? "Hide password" : "Show password");
    });

    emailInput.addEventListener("input", hideError);
    passInput.addEventListener("input", hideError);

    /* already logged in on this browser? go straight to the dashboard; otherwise make sure the cookie is cleared */
    var session = null;
    try { session = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) {}
    if (session && session.authenticated === true) {
      fetch("/api/admin/me", { cache: "no-store" }).then(function (r) {
        if (r.ok) location.replace(DASH);
        else sessionStorage.removeItem(KEY);
      }).catch(function () {});
    } else {
      fetch("/api/logout", { method: "POST" }).catch(function () {});
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      hideError();

      var email = emailInput.value.trim();
      var password = passInput.value;

      if (!email) { showError("Please enter your email address."); emailInput.focus(); return; }
      if (!password) { showError("Please enter your password."); passInput.focus(); return; }

      setLoading(true);

      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, body: j }; });
      }).then(function (res) {
        if (!res.ok) throw new Error(res.body.error || "Sign in failed.");

        if (rememberInput.checked) localStorage.setItem("websiteDealsRememberedEmail", email);
        else localStorage.removeItem("websiteDealsRememberedEmail");

        sessionStorage.setItem(KEY, JSON.stringify({
          authenticated: true,
          email: res.body.email || email,
          uid: "admin",
          role: String(res.body.role || "superadmin").toLowerCase(),
          name: res.body.name || "Admin",
          loginTime: new Date().toISOString()
        }));
        showToast("Login Successful", "Welcome back, " + (res.body.name || "Admin") + ".");
        setTimeout(function () { location.href = DASH; }, 600);
      }).catch(function (err) {
        setLoading(false);
        showError(err && err.message ? err.message : "Network error. Please check your internet connection.");
        passInput.focus();
      });
    });

    $("forgot-password").addEventListener("click", function (event) {
      event.preventDefault();
      showToast("Password reset", "Ask the site owner to change the ADMIN_PASSWORD secret in Cloudflare.");
    });
  })();
  </script>

</body>
</html>
